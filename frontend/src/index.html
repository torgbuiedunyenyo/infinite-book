<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Infinite Book</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div id="book">
        <div id="page">
            <div id="page-number"></div>
            <div id="content"></div>
            <div id="loading-indicator">
                <span class="loading-text">Discovering</span><span class="loading-dots"><span>.</span><span>.</span><span>.</span></span>
            </div>
        </div>
        <div id="nav-left" class="nav-zone">
            <span class="nav-arrow">‹</span>
        </div>
        <div id="nav-right" class="nav-zone">
            <span class="nav-arrow">›</span>
        </div>
        <div id="colophon" class="colophon">
            <span class="colophon-mark">❧</span>
            <div class="colophon-content">
                <p><em>The Shape of Time</em> is a hyperbook crafted by Jeremy Kirshbaum.</p>
                <p>If you explore it, please let him know what you think at <a href="mailto:jjkirshbaum@gmail.com">jjkirshbaum@gmail.com</a></p>
            </div>
        </div>
    </div>
    <script type="module" src="./app.ts"></script>
</body>
</html>
